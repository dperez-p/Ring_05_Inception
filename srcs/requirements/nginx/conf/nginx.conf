server {
	#listen only on port 443 with TLS as the subject requires
	listen 443 ssl;
	server_name dperez-p.42.fr;

	# self-signed certificate and its private key, generated in the Dockerfile
	ssl_certificate /etc/nginx/ssl/inception.crt;
	ssl_certificate_key /etc/nginx/ssl/inception.key;
	# only allow the secure, modern TLS versions required
	ssl_protocols TLSv1.2 TLSv1.3;

	# WordPress files live here (shares volume with the wordpress container)
	root /var/www/html;
	index index.php index.html;

	#location for everything that is NOT a .php file: static files (images, css, js) or wordpress pretty URL's 
	location / {
		# try to serve the exact file, otherwise let WordPress handle the routing via index.php
		try_files $uri $uri/ /index.php?$args;
	}

	# location for any request ending in .php must be executed as code, never as plain text (security risk)
	location ~ \.php$ {
		# request to the wordpress service (php-fpm)
		# on port 9000, using FastCGI protocol
		fastcgi_pass wordpress:9000;

		# default script to run if none is specified
		fastcgi_index index.php;

		# tell php-fpm exactly which PHP file to execute
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

		# include standard FastCGI parameters (provided by nginx itself)
		include fastcgi_params;
		}
	# bonus: adminer, a database management tool, served under /adminer/
	location /adminer/ {
		fastcgi_pass adminer:9001;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
		include fastcgi_params;
	}
}
