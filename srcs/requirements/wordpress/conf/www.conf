[www]
; listen on a TCP port (explicit 0.0.0.0, all interfaces) instead of
; a unix socket, so nginx (another container) can reach php-fpm
listen = 0.0.0.0:9000

; system user/group the worker processes run as (required directive,
; www-data is the standard low-privilege user for web server processes)
user = www-data
group = www-data

; process manager mode: "dynamic" adjusts the number of worker
; processes automatically between min/max based on load
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
