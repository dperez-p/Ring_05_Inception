secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  credentials:
    file: ../secrets/credentials.txt

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dperez-p/data/wordpress
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dperez-p/data/mariadb

networks:
  inception:
    driver: bridge

services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:1.0
    container_name: mariadb
    networks:
      - inception
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password
    restart: on-failure

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:1.0
    container_name: wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    secrets:
      - db_password
      - credentials
      - wp_user_password
    depends_on:
      - mariadb
    restart: on-failure

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:1.0
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    depends_on:
      - wordpress
    restart: on-failure

  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer:1.0
    container_name: adminer
    networks:
      - inception
    depends_on:
      - mariadb
    restart: on-failure

  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis:1.0
    container_name: redis
    networks:
      - inception
    restart: on-failure
